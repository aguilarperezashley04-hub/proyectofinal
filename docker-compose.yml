services:
  postgres:
    image: postgres:18
    container_name: postgresql
    restart: unless-stopped

    environment:
      POSTGRES_DB: db_ashley
      POSTGRES_USER: ashley
      POSTGRES_PASSWORD: 13778892
      TZ: 'America/La_Paz' # adicionado
      PGTZ: 'America/La_Paz'  # adicionado
    command: ["postgres", "-c", "timezone=America/La_Paz"]  # adicionado

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashley -d db_ashley"]
      interval: 10s
      timeout: 5s
      retries: 5

  mariadb:
    image: mariadb:11.8.9-ubi9
    container_name: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: 13778892
      MARIADB_DATABASE: db_ashley
      MARIADB_USER: ashley
      MARIADB_PASSWORD: 13778892
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - 8081:8080

  pgadmin4:
    image: dpage/pgadmin4
    container_name: pgadmin4
    restart: always
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@upds.com
      PGADMIN_DEFAULT_PASSWORD: 123123
    volumes:
      - pgadmin-data:/var/lib/pgadmin


volumes:
  mariadb_data:
    driver: local
  postgres_data:
    driver: local
  pgadmin-data:   # Agregado el volumen para persistencia de pgAdmin
    driver: local
